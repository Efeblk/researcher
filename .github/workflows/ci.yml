name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore .NET dependencies
        run: dotnet restore AcademicCollectorDemo.Tests/AcademicCollectorDemo.Tests.csproj

      - name: Install front-end dependencies
        run: npm ci

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Type-check front end
        run: npm run typecheck

      - name: Test front-end behavior
        run: npm test

      - name: Start isolated test SQL Server
        run: bash .github/scripts/start-test-sqlserver.sh

      - name: Test server and SQL Server persistence
        run: dotnet test AcademicCollectorDemo.Tests/AcademicCollectorDemo.Tests.csproj --configuration Release --no-restore

      - name: Stop test SQL Server
        if: always()
        run: docker rm -f academic-test-sqlserver || true
