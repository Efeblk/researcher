name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    uses: ./.github/workflows/classify-changes.yml

  windows-build:
    name: Windows build
    needs: classify-changes
    if: always() && needs.classify-changes.outputs.run_ci != 'false'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore dependencies
        run: dotnet restore AcademicCollectorDemo.sln

      - name: Install front-end dependencies
        run: npm ci

      - name: Verify collector excludes nested analysis projects
        shell: pwsh
        run: |
          $items = dotnet msbuild AcademicCollectorDemo.csproj -getItem:Compile,Content,None -p:DefaultItemExcludes=**/obj/**
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evaluated = ($items | ConvertFrom-Json).Items
          foreach ($kind in @('Compile', 'Content', 'None')) {
            $included = $evaluated.$kind | Where-Object { $_.Identity -match '^ResearcherAnalysis(Service(\.Tests)?|\.Contracts)[\\/]' }
            if ($included) { throw "Collector includes analysis project files as $kind" }
          }

      - name: Build solution
        run: dotnet build AcademicCollectorDemo.sln --configuration Release --no-restore

      - name: Verify independent service publish outputs
        shell: pwsh
        run: |
          $collectorPublish = Join-Path $env:RUNNER_TEMP 'collector-publish'
          $analysisPublish = Join-Path $env:RUNNER_TEMP 'analysis-publish'
          dotnet publish AcademicCollectorDemo.csproj --configuration Release --no-build --no-restore -p:SkipTSBuild=true --output $collectorPublish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish ResearcherAnalysisService/ResearcherAnalysisService.csproj --configuration Release --no-build --no-restore --output $analysisPublish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $collectorPublish 'ResearcherAnalysisService.dll')) { throw "Collector publish includes analysis runtime" }
          if (Test-Path (Join-Path $collectorPublish 'ResearcherAnalysisService/appsettings.json')) { throw "Collector publish includes analysis configuration" }
          if (Test-Path (Join-Path $analysisPublish 'AcademicCollectorDemo.dll')) { throw "Analysis publish includes collector runtime" }
          if (Test-Path (Join-Path $analysisPublish 'academicsettings.json')) { throw "Analysis publish includes collector configuration" }

      - name: Test analysis service
        run: dotnet test ResearcherAnalysisService.Tests/ResearcherAnalysisService.Tests.csproj --configuration Release --no-build --no-restore

      - name: Smoke-test independent startup and shared migrations
        shell: pwsh
        env:
          RUN_SERVICE_BOUNDARY_SMOKE: true
          SERVICE_BOUNDARY_REPOSITORY_ROOT: ${{ github.workspace }}
        run: dotnet test ResearcherAnalysisService.Tests/ResearcherAnalysisService.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~ServiceStartupBoundarySmokeTests

  build:
    name: Build
    needs: classify-changes
    if: always() && needs.classify-changes.outputs.run_ci != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore .NET dependencies
        run: dotnet restore AcademicCollectorDemo.sln

      - name: Install front-end dependencies
        run: npm ci

      - name: Build
        run: dotnet build AcademicCollectorDemo.sln --configuration Release --no-restore

      - name: Type-check front end
        run: npm run typecheck

      - name: Test front-end behavior
        run: npm test

      - name: Start isolated test SQL Server
        run: bash .github/scripts/start-test-sqlserver.sh

      - name: Test analysis service with synthetic AI responses
        run: dotnet test ResearcherAnalysisService.Tests/ResearcherAnalysisService.Tests.csproj --configuration Release --no-build --no-restore

      - name: Test server and SQL Server persistence
        run: dotnet test AcademicCollectorDemo.Tests/AcademicCollectorDemo.Tests.csproj --configuration Release --no-restore

      - name: Stop test SQL Server
        if: always()
        run: docker rm -f academic-test-sqlserver || true
